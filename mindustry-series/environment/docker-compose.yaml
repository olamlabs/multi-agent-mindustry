{
  "services": {
    "main": {
      "build": {
        "context": ".",
        "target": "simulation"
      },
      "networks": [
        "control"
      ],
      "platform": "linux/amd64",
      "command": [
        "/bin/sh",
        "-c",
        "PATH=/usr/local/bin:/usr/bin:/bin exec node /app/sim/seats.mjs --seat-clients"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/bin/sh",
          "-c",
          "PATH=/usr/local/bin:/usr/bin:/bin node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""
        ],
        "interval": "5s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "1h"
      },
      "environment": {
        "MINDUSTRY_SEATS": "[\"seat-1\", \"seat-2\", \"seat-3\", \"seat-4\"]",
        "MINDUSTRY_SIM_SETTINGS": "{\"game_mode\": \"pvp\", \"map\": \"Ring Arena\", \"time_limit_sec\": 600, \"seed\": 1, \"games\": 3, \"chat_after_sec\": 300, \"all_chat\": false, \"lobby_sec\": 1800, \"video\": {\"record\": false, \"fps\": 5, \"width\": 960, \"height\": 540, \"seats\": []}, \"replay\": {\"record\": true, \"segment_sec\": 600, \"keyframe_sec\": 60}}"
      },
      "volumes": [
        "seat-1-token:/run/seat-tokens/seat-1",
        "seat-2-token:/run/seat-tokens/seat-2",
        "seat-3-token:/run/seat-tokens/seat-3",
        "seat-4-token:/run/seat-tokens/seat-4"
      ]
    },
    "api": {
      "build": "./gateway",
      "networks": [
        "agents",
        "control"
      ],
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      }
    },
    "seat-1": {
      "build": "./seat-box",
      "networks": [
        "agents"
      ],
      "init": true,
      "cpus": 2,
      "mem_limit": "2048m",
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "MINDUSTRY_SEAT": "seat-1",
        "MINDUSTRY_SIM_URL": "http://api:8080"
      },
      "volumes": [
        "seat-1-token:/run/mindustry:ro"
      ]
    },
    "seat-2": {
      "build": "./seat-box",
      "networks": [
        "agents"
      ],
      "init": true,
      "cpus": 2,
      "mem_limit": "2048m",
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "MINDUSTRY_SEAT": "seat-2",
        "MINDUSTRY_SIM_URL": "http://api:8080"
      },
      "volumes": [
        "seat-2-token:/run/mindustry:ro"
      ]
    },
    "seat-3": {
      "build": "./seat-box",
      "networks": [
        "agents"
      ],
      "init": true,
      "cpus": 2,
      "mem_limit": "2048m",
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "MINDUSTRY_SEAT": "seat-3",
        "MINDUSTRY_SIM_URL": "http://api:8080"
      },
      "volumes": [
        "seat-3-token:/run/mindustry:ro"
      ]
    },
    "seat-4": {
      "build": "./seat-box",
      "networks": [
        "agents"
      ],
      "init": true,
      "cpus": 2,
      "mem_limit": "2048m",
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "MINDUSTRY_SEAT": "seat-4",
        "MINDUSTRY_SIM_URL": "http://api:8080"
      },
      "volumes": [
        "seat-4-token:/run/mindustry:ro"
      ]
    }
  },
  "networks": {
    "agents": {},
    "control": {
      "internal": true
    }
  },
  "volumes": {
    "seat-1-token": {},
    "seat-2-token": {},
    "seat-3-token": {},
    "seat-4-token": {}
  }
}
