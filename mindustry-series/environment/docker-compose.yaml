{
  "services": {
    "main": {
      "build": {
        "context": "..",
        "dockerfile": "environment/Dockerfile",
        "target": "simulation"
      },
      "networks": [
        "control"
      ],
      "platform": "linux/amd64",
      "command": [
        "/bin/sh",
        "-c",
        "PATH=/usr/local/bin:/usr/bin:/bin exec node /app/sim/seats.mjs --seat-clients"
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "/bin/sh",
          "-c",
          "PATH=/usr/local/bin:/usr/bin:/bin node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""
        ],
        "interval": "5s",
        "timeout": "10s",
        "retries": 3,
        "start_period": "1h"
      },
      "environment": {
        "HARBOR_SEATS": "[\"seat-1\", \"seat-2\", \"seat-3\", \"seat-4\"]",
        "HARBOR_SIM_SETTINGS": "{\"game_mode\": \"pvp\", \"map\": \"Harbor Ring\", \"time_limit_sec\": 600, \"seed\": 1, \"games\": 3, \"chat_after_sec\": 300, \"all_chat\": false, \"lobby_sec\": 1800, \"video\": {\"record\": true, \"fps\": 5, \"width\": 960, \"height\": 540, \"seats\": \"all\"}, \"replay\": {\"record\": true, \"segment_sec\": 600, \"keyframe_sec\": 60}}"
      },
      "volumes": [
        "camera-control:/run/mindustry-control",
        "seat-1-token:/run/seat-tokens/seat-1",
        "seat-2-token:/run/seat-tokens/seat-2",
        "seat-3-token:/run/seat-tokens/seat-3",
        "seat-4-token:/run/seat-tokens/seat-4"
      ]
    },
    "api": {
      "build": "./gateway",
      "networks": [
        "agents",
        "control"
      ],
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      }
    },
    "seat-1": {
      "build": "./seat-box",
      "networks": [
        "agents"
      ],
      "init": true,
      "cpus": 2,
      "mem_limit": "2048m",
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "HARBOR_SEAT": "seat-1",
        "HARBOR_SIM_URL": "http://api:8080"
      },
      "volumes": [
        "seat-1-token:/run/mindustry:ro"
      ]
    },
    "seat-1-game": {
      "build": {
        "context": "..",
        "dockerfile": "environment/Dockerfile",
        "target": "runtime"
      },
      "networks": [
        "control"
      ],
      "platform": "linux/amd64",
      "command": [
        "node",
        "/opt/mindustry/environment/seat-client/client.mjs"
      ],
      "volumes": [
        "camera-control:/run/mindustry-control:ro"
      ],
      "init": true,
      "stop_grace_period": "90s",
      "cpus": 2,
      "mem_limit": "2048m",
      "depends_on": {
        "main": {
          "condition": "service_healthy"
        }
      },
      "environment": {
        "HARBOR_SEAT": "seat-1",
        "HARBOR_SIM_URLS": "{\"9000\": \"http://main:9000\", \"9001\": \"http://main:9001\"}",
        "HARBOR_SIM_HEADERS": "{}",
        "MINDUSTRY_RECORDINGS_DIR": "/recordings/seat-1",
        "MINDUSTRY_SEAT_RUN_DIR": "/tmp/mindustry-seat/seat-1"
      }
    },
    "seat-2": {
